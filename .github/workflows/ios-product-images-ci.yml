name: iOS Product Images CI

on:
  pull_request:
    paths:
      - ".github/workflows/ios-product-images-ci.yml"
      - "contracts/**"
      - "iOSMerchandiseControl/**"
      - "iOSMerchandiseControl.xcodeproj/**"
      - "iOSMerchandiseControlTests/**"
      - "iOSMerchandiseControlUITests/**"
      - ".github/ci/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios-product-images-ci.yml"
      - "contracts/**"
      - "iOSMerchandiseControl/**"
      - "iOSMerchandiseControl.xcodeproj/**"
      - "iOSMerchandiseControlTests/**"
      - "iOSMerchandiseControlUITests/**"
      - ".github/ci/**"
  workflow_dispatch:
    inputs:
      task144_a_campaign:
        description: "Run five isolated executions of the original TASK-144 A test"
        type: boolean
        required: false
        default: false
      task146_export_ordinary_app:
        description: "Focused ARM diagnostic only: export the compiled app with hashes for ordinary TEST reuse"
        type: boolean
        required: false
        default: false
      task146_focused_tests:
        description: "Diagnostic only: JSON array of up to 16 active frozen selectors; never final acceptance"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ios-product-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-images:
    name: XCTest (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.task146_focused_tests != '') && '["focused"]' || (github.event_name == 'workflow_dispatch' && inputs.task144_a_campaign == true) && '["campaign-a"]' || '["unit-target","ui-core","ui-core-continuation","ui-long-observation","ui-t18-it","ui-t18-en","ui-t18-es","ui-t18-zh"]') }}
    runs-on: macos-26
    timeout-minutes: 75
    env:
      TASK146_FOCUSED_TESTS: ${{ inputs.task146_focused_tests || '' }}
      TASK144_A_CAMPAIGN: ${{ inputs.task144_a_campaign || false }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate explicit focused selection
        if: ${{ matrix.shard == 'focused' || inputs.task146_export_ordinary_app == true }}
        run: python3 .github/ci/ios-xctest-shards.py validate-focused focused

      - name: Record diagnostic export reservation
        run: python3 -c 'from pathlib import Path; import os,time; (Path(os.environ["RUNNER_TEMP"])/"ios-ci-start.monotonic").write_text(str(time.monotonic()))'

      - name: Verify shared contract hashes
        run: shasum -a 256 -c contracts/product-image-v1.sha256

      - name: Select an available iPhone Simulator
        run: |
          # Initialize CoreSimulator before asking Xcode for concrete destinations.
          xcrun simctl list devices available
          select_device_id() {
            printf '%s\n' "$1" | ruby -e '
              device_id = nil
              STDIN.each_line do |line|
                next if line.include?("error:")
                match = line.match(/\{ platform:iOS Simulator,.*id:([^,}]+),.*name:iPhone/)
                next unless match

                device_id = match[1].strip
                break
              end
              abort "No scheme-compatible iPhone Simulator" unless device_id
              puts device_id
            '
          }
          DESTINATIONS="$(xcodebuild \
            -project iOSMerchandiseControl.xcodeproj \
            -scheme iOSMerchandiseControl \
            -showdestinations 2>&1)"
          if ! DEVICE_ID="$(select_device_id "$DESTINATIONS")"; then
            printf '%s\n' "$DESTINATIONS"
            # The runner can have an installed runtime but no concrete iPhone.
            # Re-query the scheme so an incompatible runtime still fails the job.
            xcrun simctl create "MerchandiseControl CI" "iPhone 17"
            DESTINATIONS="$(xcodebuild \
              -project iOSMerchandiseControl.xcodeproj \
              -scheme iOSMerchandiseControl \
              -showdestinations 2>&1)"
            DEVICE_ID="$(select_device_id "$DESTINATIONS")"
          fi
          echo "Selected compatible simulator: $DEVICE_ID"
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"

      - name: Record Xcode and SDK resource preflight
        run: |
          xcodebuild -version
          python3 - <<'PY'
          import datetime,json,os,subprocess
          from pathlib import Path
          phase='before-sdk'
          device=os.environ['DEVICE_ID']
          def state():
              tree=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json'],text=True,timeout=20))
              found=[row for rows in tree['devices'].values()for row in rows if row['udid']==device]
              assert len(found)==1,'selected Simulator identity changed'
              return found[0]['state'],sum(row['state']=='Booted'for rows in tree['devices'].values()for row in rows)
          initial,booted=state()
          # Every action addresses the one UUID claimed by this fresh hosted job.
          if phase!='after-boot'and initial!='Shutdown':
              assert initial in ('Booted','Booting'),'unclassified selected Simulator state: '+initial
              subprocess.run(['xcrun','simctl','shutdown',device],check=True,timeout=20)
          current,booted=state()
          assert current==('Booted'if phase=='after-boot'else'Shutdown'),current
          row={'phase':phase,'atUTC':datetime.datetime.now(datetime.timezone.utc).isoformat(),'device':device,'initialState':initial,'state':current,'bootedCount':booted,
               'swap':subprocess.check_output(['sysctl','vm.swapusage'],text=True,timeout=20).strip()[:8192],
               'vm':subprocess.check_output(['vm_stat'],text=True,timeout=20).strip()[:8192]}
          path=Path(os.environ['RUNNER_TEMP'])/'task146-runner-resources.jsonl'
          if phase=='before-sdk':assert not path.exists(),'refuse mixed resource observations'
          else:assert path.exists(),'missing SDK resource preflight'
          encoded=json.dumps(row,sort_keys=True)+'\n';assert len(encoded.encode())<16384
          with path.open('x'if phase=='before-sdk'else'a')as stream:stream.write(encoded)
          assert path.stat().st_size<=65536,'resource observation bound exceeded'
          print(json.dumps({key:row[key]for key in ['phase','state','bootedCount','swap']}))
          PY

      - name: Build Debug
        timeout-minutes: 15
        env:
          TASK146_BUILD_SHARD: ${{ matrix.shard }}
        run: |
          python3 - <<'PYBUILD'
          import hashlib,json,os,resource,shlex,signal,subprocess,sys
          from pathlib import Path
          temporary=Path(os.environ['RUNNER_TEMP'])
          selected=json.loads(os.environ.get('TASK146_FOCUSED_TESTS')or'[]')
          # Measure cached startup first in the existing long-observation shard,
          # before earlier UI cases accumulate runner state. All2101 selectors
          # stay in the same eight-way matrix; T0/5s and assertions are unchanged.
          cache_selector='iOSMerchandiseControlUITests/LocalAvailabilityRootUITests/testIndependentHistoryWorkbookAndCatalogReadWhileAnotherDomainIsHeld'
          coverage=json.loads(Path('.github/ci/ios-xctest-coverage.json').read_text())
          cached_start_suite=next(row for row in coverage['shards']if row['id']=='ui-long-observation')
          optimized=(os.environ['TASK146_BUILD_SHARD']=='ui-long-observation'or(
              os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch'
              and os.environ['TASK146_BUILD_SHARD']=='focused'
              and cache_selector in selected and set(selected)<=set(cached_start_suite['expected'])))
          argv=['xcodebuild','-project','iOSMerchandiseControl.xcodeproj','-scheme','iOSMerchandiseControl',
              '-configuration','Debug','-destination','platform=iOS Simulator,id='+os.environ['DEVICE_ID'],
              'CODE_SIGNING_ALLOWED=YES','CODE_SIGN_IDENTITY=-']
          profile={'name':'DEBUG_OPTIMIZED_ASSERTIONS_CACHED_START'if optimized else'DEBUG_STANDARD',
              'optimization':'-O'if optimized else'-Onone(project Debug)',
              'compilationMode':'wholemodule'if optimized else'incremental(project Debug)',
              'assertConfiguration':'Debug(forced)'if optimized else'Debug(project default)',
              'scope':'project Debug targets; first cached startup and long regressions'if optimized else'unchanged stock build',
              'assertionProbe':{'status':'NOT_REQUESTED_ON_STANDARD'}}
          path=temporary/'task146-debug-build-profile.json'
          def save():path.write_text(json.dumps(profile,indent=2)+'\n')
          save()
          if optimized:
              # Preserve Debug assertions while optimizing the large DEBUG UI
              # fixture. Prove the actual SDK compiler retains a real assertion.
              resource.setrlimit(resource.RLIMIT_CORE,(0,0))
              probe=temporary/'task146-debug-assertion-probe';probe.mkdir(exist_ok=False)
              source=probe/'probe.swift';binary=probe/'probe'
              source.write_text('if !_isDebugAssertConfiguration() { fatalError("TASK146_ASSERT_CONFIG_DISABLED") }\nif CommandLine.arguments.contains("trip") { assert(false, "TASK146_DEBUG_ASSERTION_PROBE") }\nprint("TASK146_DEBUG_ASSERTIONS_ENABLED")\n')
              command=['xcrun','swiftc','-O','-whole-module-optimization','-Xfrontend','-assert-config','-Xfrontend','Debug',str(source),'-o',str(binary)]
              profile['assertionProbe']={'status':'RUNNING','sourceSHA256':hashlib.sha256(source.read_bytes()).hexdigest(),'compilerArguments':command};save()
              subprocess.run(command,check=True,timeout=90)
              positive=subprocess.run([str(binary)],capture_output=True,text=True,timeout=15)
              negative=subprocess.run([str(binary),'trip'],capture_output=True,text=True,timeout=15)
              assert positive.returncode==0 and positive.stdout.strip()=='TASK146_DEBUG_ASSERTIONS_ENABLED'
              assert negative.returncode in[-signal.SIGILL,-signal.SIGTRAP]and'TASK146_DEBUG_ASSERTION_PROBE'in negative.stderr
              profile['assertionProbe'].update(status='PASS_REAL_DEBUG_ASSERTION_RETAINED',positiveExit=positive.returncode,
                  negativeSignal=-negative.returncode,negativeMessageVerified=True,binarySHA256=hashlib.sha256(binary.read_bytes()).hexdigest())
              # Both owned probe processes have exited; keep the small receipt.
              (probe/'verification.json').write_text(json.dumps(profile['assertionProbe'],indent=2)+'\n')
              source.unlink();binary.unlink()
              # Custom settings are expanded only by this project's Debug
              # configuration; SPM dependencies keep their stock Debug flags.
              # Cross-file specialization targets the measured startup/UI work;
              # this profile retains the same real Debug assertion probe.
              argv+=['TASK146_NATIVE_OPTIMIZATION_LEVEL=-O','TASK146_NATIVE_COMPILATION_MODE=wholemodule',
                  'TASK146_NATIVE_PROFILE_SWIFT_FLAGS=-Xfrontend -assert-config -Xfrontend Debug -D TASK146_NATIVE_OPTIMIZED_ASSERTS']
          argv+=['build-for-testing'];profile['buildArguments']=argv;save()
          print(json.dumps({key:profile[key]for key in['name','optimization','assertConfiguration','scope']}),flush=True)
          witnesses={};wholemodule_drivers={}
          process=subprocess.Popen(argv,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
          for line in process.stdout:
              sys.stdout.write(line)
              if '-module-name 'not in line or('swiftc 'not in line and'swift-frontend 'not in line):continue
              try:
                  arguments=shlex.split(line);module=arguments[arguments.index('-module-name')+1]
              except(ValueError,IndexError):continue
              witness={'optimization':[x for x in arguments if x in['-O','-Onone','-Osize','-Ounchecked']],
                  'forcedDebugAssertions':any(arguments[i:i+2]==['-assert-config','Debug']or arguments[i:i+3]==['-assert-config','-Xfrontend','Debug']for i in range(len(arguments))),
                  'optimizedProfileMacro':'TASK146_NATIVE_OPTIMIZED_ASSERTS'in arguments}
              if witness not in witnesses.setdefault(module,[]):witnesses[module].append(witness)
              # swift-frontend consumes the driver's mode and omits the flag.
              # Require the explicit mode on every observed compiler driver.
              if 'swiftc 'in line:
                  wholemodule_drivers.setdefault(module,[]).append('-whole-module-optimization'in arguments or '-wmo'in arguments)
          code=process.wait();profile['SDKBuildExit']=code;profile['compilerWitnesses']=witnesses;profile['wholeModuleDriverWitnesses']=wholemodule_drivers
          if optimized and code==0:
              projectModules=['iOSMerchandiseControl','iOSMerchandiseControlTests','iOSMerchandiseControlUITests']
              checks={module:bool(witnesses.get(module))and all(row=={'optimization':['-O'],
                  'forcedDebugAssertions':True,'optimizedProfileMacro':True}for row in witnesses[module])for module in projectModules}
              for module in projectModules:
                  checks[module+'.wholemoduleDriver']=bool(wholemodule_drivers.get(module))and all(wholemodule_drivers[module])
              checks['IssueReportingStockDebug']=bool(witnesses.get('IssueReporting'))and all(row=={'optimization':['-Onone'],
                  'forcedDebugAssertions':False,'optimizedProfileMacro':False}for row in witnesses['IssueReporting'])
              profile['SDKProfileVerification']={'status':'PASS'if all(checks.values())else'FAIL','checks':checks}
              save();assert all(checks.values()),checks
          save()
          raise SystemExit(code)
          PYBUILD

      - name: Package exact ordinary ARM app
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.task146_export_ordinary_app == true && matrix.shard == 'focused' }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,stat,subprocess,tarfile
          from pathlib import Path
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert head==os.environ['GITHUB_SHA']
          roots=list((Path.home()/'Library/Developer/Xcode/DerivedData').glob('iOSMerchandiseControl-*/Build/Products/Debug-iphonesimulator/iOSMerchandiseControl.app'))
          assert len(roots)==1, 'require the single product compiled by this fresh job'
          app=roots[0];assert app.is_dir() and not app.is_symlink()
          rows=[]
          for path in sorted(app.rglob('*')):
              assert not path.is_symlink(), 'do not export linked native inputs'
              info=path.stat();assert stat.S_ISREG(info.st_mode) or stat.S_ISDIR(info.st_mode)
              if path.is_file():
                  rows.append({'path':path.relative_to(app).as_posix(),'bytes':info.st_size,
                      'mode':stat.S_IMODE(info.st_mode),'sha256':hashlib.sha256(path.read_bytes()).hexdigest()})
          out=Path(os.environ['RUNNER_TEMP'])/'task146-ordinary-app';out.mkdir(exist_ok=False)
          package=out/'ordinary-app.tar.gz'
          with tarfile.open(package,'w:gz',compresslevel=1)as archive:archive.add(app,arcname=app.name)
          for row in rows:
              path=app/row['path'];assert path.stat().st_size==row['bytes'] and hashlib.sha256(path.read_bytes()).hexdigest()==row['sha256']
          manifest={'scope':'SDK_PRODUCT_ONLY_NOT_NATIVE_ACCEPTANCE','head':head,'runID':os.environ['GITHUB_RUN_ID'],
              'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'architecture':subprocess.check_output(['uname','-m'],text=True).strip(),
              'xcode':subprocess.check_output(['xcodebuild','-version'],text=True).strip(),
              'workflowSHA256':hashlib.sha256(Path('.github/workflows/ios-product-images-ci.yml').read_bytes()).hexdigest(),
              'appSourceTree':subprocess.check_output(['git','rev-parse','HEAD:iOSMerchandiseControl'],text=True).strip(),
              'packageBytes':package.stat().st_size,'packageSHA256':hashlib.sha256(package.read_bytes()).hexdigest(),
              'appBytes':sum(row['bytes']for row in rows),'fileCount':len(rows),'files':rows,
              'debugBuildProfile':json.loads((Path(os.environ['RUNNER_TEMP'])/'task146-debug-build-profile.json').read_text())}
          assert manifest['architecture']=='arm64'
          (out/'ordinary-app.manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps({key:manifest[key]for key in ['scope','head','architecture','appBytes','packageBytes','fileCount']}))
          PY

      - name: Preserve exact ordinary ARM app
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.task146_export_ordinary_app == true && matrix.shard == 'focused' }}
        uses: actions/upload-artifact@v4
        with:
          name: task146-ordinary-app-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/task146-ordinary-app/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Release SDK memory before Simulator boot
        run: |
          python3 - <<'PY'
          import datetime,json,os,subprocess
          from pathlib import Path
          phase='after-sdk'
          device=os.environ['DEVICE_ID']
          def state():
              tree=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json'],text=True,timeout=20))
              found=[row for rows in tree['devices'].values()for row in rows if row['udid']==device]
              assert len(found)==1,'selected Simulator identity changed'
              return found[0]['state'],sum(row['state']=='Booted'for rows in tree['devices'].values()for row in rows)
          initial,booted=state()
          # Every action addresses the one UUID claimed by this fresh hosted job.
          if phase!='after-boot'and initial!='Shutdown':
              assert initial in ('Booted','Booting'),'unclassified selected Simulator state: '+initial
              subprocess.run(['xcrun','simctl','shutdown',device],check=True,timeout=20)
          current,booted=state()
          assert current==('Booted'if phase=='after-boot'else'Shutdown'),current
          row={'phase':phase,'atUTC':datetime.datetime.now(datetime.timezone.utc).isoformat(),'device':device,'initialState':initial,'state':current,'bootedCount':booted,
               'swap':subprocess.check_output(['sysctl','vm.swapusage'],text=True,timeout=20).strip()[:8192],
               'vm':subprocess.check_output(['vm_stat'],text=True,timeout=20).strip()[:8192]}
          path=Path(os.environ['RUNNER_TEMP'])/'task146-runner-resources.jsonl'
          if phase=='before-sdk':assert not path.exists(),'refuse mixed resource observations'
          else:assert path.exists(),'missing SDK resource preflight'
          encoded=json.dumps(row,sort_keys=True)+'\n';assert len(encoded.encode())<16384
          with path.open('x'if phase=='before-sdk'else'a')as stream:stream.write(encoded)
          assert path.stat().st_size<=65536,'resource observation bound exceeded'
          print(json.dumps({key:row[key]for key in ['phase','state','bootedCount','swap']}))
          PY

      - name: Boot selected Simulator after SDK compilation
        run: |
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          python3 - <<'PY'
          import datetime,json,os,subprocess
          from pathlib import Path
          phase='after-boot'
          device=os.environ['DEVICE_ID']
          def state():
              tree=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json'],text=True,timeout=20))
              found=[row for rows in tree['devices'].values()for row in rows if row['udid']==device]
              assert len(found)==1,'selected Simulator identity changed'
              return found[0]['state'],sum(row['state']=='Booted'for rows in tree['devices'].values()for row in rows)
          # boot and bootstatus above are checked functional preconditions.
          # A resource probe must not reject that successful boot on an AX-busy VM.
          state_probe_error=None
          try:
              initial,booted=state()
              current=initial
              assert current=='Booted',current
          except subprocess.TimeoutExpired:
              initial=current='UNKNOWN_RESOURCE_PROBE_TIMEOUT'
              booted=None
              state_probe_error='simctl list exceeded diagnostic 20s; bootstatus succeeded'
          row={'phase':phase,'atUTC':datetime.datetime.now(datetime.timezone.utc).isoformat(),'device':device,'initialState':initial,'state':current,'bootedCount':booted,
               'swap':subprocess.check_output(['sysctl','vm.swapusage'],text=True,timeout=20).strip()[:8192],
               'vm':subprocess.check_output(['vm_stat'],text=True,timeout=20).strip()[:8192]}
          row['bootstatusExitCode']=0
          row['stateProbeError']=state_probe_error
          path=Path(os.environ['RUNNER_TEMP'])/'task146-runner-resources.jsonl'
          if phase=='before-sdk':assert not path.exists(),'refuse mixed resource observations'
          else:assert path.exists(),'missing SDK resource preflight'
          encoded=json.dumps(row,sort_keys=True)+'\n';assert len(encoded.encode())<16384
          with path.open('x'if phase=='before-sdk'else'a')as stream:stream.write(encoded)
          assert path.stat().st_size<=65536,'resource observation bound exceeded'
          print(json.dumps({key:row[key]for key in ['phase','state','bootedCount','swap']}))
          PY

      - name: XCTest exact coverage shard
        if: ${{ matrix.shard != 'campaign-a' }}
        id: xctest
        run: python3 .github/ci/ios-xctest-shards.py run '${{ matrix.shard }}'

      - name: XCTest A fixed campaign
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.task144_a_campaign == true }}
        id: a_campaign
        run: |
          CAMPAIGN_DIR="$RUNNER_TEMP/task144-a-campaign"
          mkdir -p "$CAMPAIGN_DIR"
          python3 - "$CAMPAIGN_DIR/environment.json" <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          read = lambda *args: subprocess.check_output(args, text=True).strip()
          toolchain = read('xcodebuild', '-version').splitlines()
          devices = json.loads(read('xcrun', 'simctl', 'list', 'devices', 'available', '--json'))
          selected = [(runtime, device) for runtime, rows in devices['devices'].items()
                      for device in rows if device['udid'] == os.environ['DEVICE_ID']]
          environment = {'head': read('git', 'rev-parse', 'HEAD'), 'toolchain': toolchain,
                         'macOS': read('sw_vers', '-productVersion'),
                         'architecture': read('uname', '-m'), 'selectedDestination': selected}
          Path(sys.argv[1]).write_text(json.dumps(environment, indent=2) + '\n')
          assert toolchain == ['Xcode 26.6', 'Build version 17F113']
          assert environment['macOS'].startswith('26.') and environment['architecture'] == 'arm64'
          assert len(selected) == 1 and selected[0][0] == 'com.apple.CoreSimulator.SimRuntime.iOS-26-2'
          assert selected[0][1]['name'] == 'iPhone 16e' and selected[0][1]['state'] == 'Booted'
          PY
          campaign_status=0
          for iteration in 1 2 3 4 5; do
            printf 'TASK144_A_CAMPAIGN_ITERATION=%s\n' "$iteration"
            set +e
            xcodebuild -project iOSMerchandiseControl.xcodeproj \
              -scheme iOSMerchandiseControl \
              -configuration Debug \
              -destination "platform=iOS Simulator,id=$DEVICE_ID" \
              -resultBundlePath "$CAMPAIGN_DIR/iteration-$iteration.xcresult" \
              -only-testing:iOSMerchandiseControlUITests/LocalAvailabilityRootUITests/testPreviousShopCallbackCannotInvalidateFreshEmptyRecoveryAdmission \
              CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test \
              2>&1 | tee "$CAMPAIGN_DIR/iteration-$iteration.log"
            command_statuses=("${PIPESTATUS[@]}")
            iteration_status=${command_statuses[0]}
            set -e
            printf '%s\n' "$iteration_status" > "$CAMPAIGN_DIR/iteration-$iteration.exit-code"
            printf '%s\n' "${command_statuses[1]}" > "$CAMPAIGN_DIR/iteration-$iteration.log-exit-code"
            if [ "$iteration_status" -ne 0 ] || [ "${command_statuses[1]}" -ne 0 ]; then
              campaign_status=1
            fi
          done
          for iteration in 1 2 3 4 5; do
            result_prefix="$CAMPAIGN_DIR/iteration-$iteration"
            set +e
            xcrun xcresulttool get test-results summary --path "$result_prefix.xcresult" \
              > "$result_prefix.summary.json" 2> "$result_prefix.summary.stderr"
            summary_status=$?
            xcrun xcresulttool get test-results tests --path "$result_prefix.xcresult" \
              > "$result_prefix.tests.json" 2> "$result_prefix.tests.stderr"
            tests_status=$?
            python3 - "$result_prefix" "$summary_status" "$tests_status" <<'PY'
          import json, sys
          from pathlib import Path
          prefix, summary_exit, tests_exit = sys.argv[1], int(sys.argv[2]), int(sys.argv[3])
          expected = 'LocalAvailabilityRootUITests/testPreviousShopCallbackCannotInvalidateFreshEmptyRecoveryAdmission()'
          result = {'status': 'FAIL', 'summaryExit': summary_exit, 'testsExit': tests_exit}
          try:
              assert summary_exit == tests_exit == 0
              summary = json.loads(Path(prefix + '.summary.json').read_text())
              tests = json.loads(Path(prefix + '.tests.json').read_text())
              cases = []
              def walk(value, module=None):
                  if isinstance(value, dict):
                      if value.get('nodeType') == 'UI test bundle':
                          module = value.get('name')
                      if value.get('nodeType') == 'Test Case':
                          cases.append({'id': value['nodeIdentifier'], 'result': value['result'], 'module': module})
                      for child in value.values():
                          walk(child, module)
                  elif isinstance(value, list):
                      for child in value:
                          walk(child, module)
              walk(tests)
              result['cases'] = cases
              result['counts'] = {key: summary[key] for key in ['totalTestCount', 'passedTests', 'failedTests', 'skippedTests']}
              result['xcodeExit'] = int(Path(prefix + '.exit-code').read_text())
              result['logExit'] = int(Path(prefix + '.log-exit-code').read_text())
              assert len(cases) == 1 and cases[0]['id'] == expected
              assert cases[0]['module'] == 'iOSMerchandiseControlUITests' and cases[0]['result'] in {'Passed', 'Failed'}
              assert result['counts'] == {'totalTestCount': 1, 'passedTests': int(cases[0]['result'] == 'Passed'),
                                          'failedTests': int(cases[0]['result'] == 'Failed'), 'skippedTests': 0}
              assert cases[0]['result'] == 'Passed' and result['xcodeExit'] == result['logExit'] == 0
              result['status'] = 'PASS'
          except (AssertionError, KeyError, ValueError, OSError) as error:
              result['verificationError'] = type(error).__name__
          Path(prefix + '.verification.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result))
          sys.exit(0 if result['status'] == 'PASS' else 1)
          PY
            verification_status=$?
            set -e
            if [ "$verification_status" -ne 0 ]; then
              campaign_status=1
            fi
          done
          exit "$campaign_status"

      - name: Preserve A campaign results
        if: ${{ always() && (steps.a_campaign.outcome == 'success' || steps.a_campaign.outcome == 'failure' || steps.a_campaign.outcome == 'cancelled') }}
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: task144-a-campaign-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/task144-a-campaign
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false

      - name: Export small XCTest failure summary
        id: xctest_failure_summary
        if: ${{ always() && matrix.shard != 'campaign-a' && (steps.xctest.outcome == 'success' || steps.xctest.outcome == 'failure' || steps.xctest.outcome == 'cancelled') }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          XCTEST_OUTCOME: ${{ steps.xctest.outcome }}
          TASK146_CI_SHARD: ${{ matrix.shard }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, selectors, signal, subprocess, sys, time
          from pathlib import Path
          STDOUT_LIMIT, STDERR_LIMIT = 2 * 1024 * 1024, 64 * 1024
          ARTIFACT_LIMIT, METADATA_RESERVE = 10 * 1024 * 1024, 64 * 1024
          MAX_FAILED_LEAVES, EXPORT_TIMEOUT_SECONDS = 4, 20
          retained_bytes = 0
          bundle = Path(os.environ['RUNNER_TEMP']) / 'ios-merchandise-control-tests.xcresult'
          output = Path(os.environ['RUNNER_TEMP']) / 'ios-xctest-failure-summary'
          output.mkdir(parents=True, exist_ok=False)  # Refuse to mix a prior artifact into this budget.
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as actions_output:
              actions_output.write(f'artifact_directory={output}\n')
          provenance = {'runId': os.environ['GITHUB_RUN_ID'], 'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
                        'repository': os.environ['GITHUB_REPOSITORY'], 'event': os.environ['GITHUB_EVENT_NAME'],
                        'ref': os.environ['GITHUB_REF'], 'eventSHA': os.environ['GITHUB_SHA'],
                        'destination': os.environ.get('DEVICE_ID'), 'xctestOutcome': os.environ['XCTEST_OUTCOME'],
                        'resultBundle': bundle.name, 'exports': [], 'failedTests': [],
                        'limits': {'stdoutBytesPerExport': STDOUT_LIMIT, 'stderrBytesPerExport': STDERR_LIMIT,
                                   'artifactBytes': ARTIFACT_LIMIT, 'metadataReservedBytes': METADATA_RESERVE,
                                   'maxFailedLeaves': MAX_FAILED_LEAVES},
                        'selectionStatus': 'NOT_PARSED_EXPORTS_PENDING'}
          digest = hashlib.sha256()
          with Path('.github/workflows/ios-product-images-ci.yml').open('rb') as source:
              for chunk in iter(lambda: source.read(65536), b''):
                  digest.update(chunk)
          provenance['workflowSHA256'] = digest.hexdigest()
          def save():
              provenance['retainedOutputBytes'] = retained_bytes
              data = (json.dumps(provenance, indent=2) + '\n').encode()
              if len(data) > METADATA_RESERVE:
                  provenance['metadataTruncated'] = True
                  data = (json.dumps({'runId': provenance['runId'], 'runAttempt': provenance['runAttempt'],
                          'eventSHA': provenance['eventSHA'], 'metadataTruncated': True,
                          'unretainedMetadataBytes': len(data), 'unretainedMetadataSHA256': hashlib.sha256(data).hexdigest(),
                          'retainedOutputBytes': retained_bytes, 'exportCount': len(provenance['exports']),
                          'failedLeafCount': provenance.get('failedLeafCount'),
                          'omittedFailedLeafCount': provenance.get('omittedFailedLeafCount'),
                          'selectionStatus': 'NOT_QUALIFIED_METADATA_LIMIT'}) + '\n').encode()
              assert len(data) <= METADATA_RESERVE
              (output / 'provenance.json').write_bytes(data)
          def export(name, argv, timeout=EXPORT_TIMEOUT_SECONDS):
              global retained_bytes
              stdout, stderr = output / name, output / (name + '.stderr')
              result = {'argv': argv, 'stdout': stdout.name, 'stderr': stderr.name,
                        'timeoutSeconds': timeout, 'attempted': False,
                        'hashScope': 'retained-file-bytes'}
              if retained_bytes >= ARTIFACT_LIMIT - METADATA_RESERVE:
                  result.update(omitted=True, omissionReason='ARTIFACT_BYTE_BUDGET',
                                parseStatus='NOT_PARSED_EXPORT_OMITTED', complete=False)
                  provenance['exports'].append(result)
                  save()
                  return False
              streams = {key: {'retainedBytes': 0, 'observedBytes': 0, 'eof': False,
                              'truncated': False, 'digest': hashlib.sha256()}
                         for key in ['stdout', 'stderr']}
              process, selector = None, selectors.DefaultSelector()
              deadline = time.monotonic() + timeout
              with stdout.open('wb') as out, stderr.open('wb') as err:
                  try:
                      process = subprocess.Popen(argv, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                                 start_new_session=True)
                      result.update(attempted=True, childPID=process.pid)
                      for pipe, key, file, limit in [(process.stdout, 'stdout', out, STDOUT_LIMIT),
                                                    (process.stderr, 'stderr', err, STDERR_LIMIT)]:
                          os.set_blocking(pipe.fileno(), False)
                          selector.register(pipe, selectors.EVENT_READ, (key, file, limit))
                      while selector.get_map():
                          remaining = deadline - time.monotonic()
                          if remaining <= 0:
                              raise subprocess.TimeoutExpired(argv, timeout)
                          for ready, _ in selector.select(remaining):
                              key, file, limit = ready.data
                              try:
                                  chunk = os.read(ready.fd, 65536)
                              except BlockingIOError:
                                  continue
                              if not chunk:
                                  streams[key]['eof'] = True
                                  selector.unregister(ready.fileobj)
                                  continue
                              stream = streams[key]
                              stream['observedBytes'] += len(chunk)
                              keep = min(len(chunk), limit - stream['retainedBytes'],
                                         ARTIFACT_LIMIT - METADATA_RESERVE - retained_bytes)
                              if keep:
                                  file.write(chunk[:keep])
                                  stream['digest'].update(chunk[:keep])
                                  stream['retainedBytes'] += keep
                                  retained_bytes += keep
                              if keep < len(chunk):
                                  stream['truncated'] = True  # Continue draining/discarding to EOF/deadline.
                      result['exitCode'] = process.wait(timeout=max(0, deadline - time.monotonic()))
                  except subprocess.TimeoutExpired:
                      result['timedOut'] = True
                  except OSError as error:
                      result.update(exitCode=None, errorType=type(error).__name__)
                  finally:
                      selector.close()
                      if process is not None:
                          try:
                              os.killpg(process.pid, signal.SIGKILL)
                          except ProcessLookupError:
                              pass
                          try:
                              result['exitCode'] = process.wait(timeout=1)
                              result['childReaped'] = True
                          except subprocess.TimeoutExpired:
                              result['childReaped'] = False
                          process.stdout.close()
                          process.stderr.close()
              for key, stream in streams.items():
                  result[key + 'SHA256'] = stream.pop('digest').hexdigest()
              result['streams'] = streams
              stdout_complete = streams['stdout']['eof'] and not streams['stdout']['truncated']
              result['parseStatus'] = 'COMPLETE_STDOUT_AVAILABLE' if stdout_complete else 'NOT_PARSED_INCOMPLETE_STDOUT'
              result['complete'] = (result.get('exitCode') == 0 and result.get('childReaped') is True
                                    and not result.get('timedOut') and not result.get('errorType')
                                    and all(stream['eof'] and not stream['truncated'] for stream in streams.values()))
              provenance['exports'].append(result)
              save()
              return (stdout_complete and result.get('exitCode') == 0 and result.get('childReaped') is True
                      and not result.get('timedOut') and not result.get('errorType'))
          save()
          export('checkout-head.txt', ['git', 'rev-parse', 'HEAD'])
          export('debug-build-profile.json', ['cat', str(Path(os.environ['RUNNER_TEMP'])/'task146-debug-build-profile.json')])
          export('toolchain.txt', ['python3', '-c', "import json,subprocess,pathlib,os; commands={'xcode':['xcodebuild','-version'],'os':['sw_vers'],'model':['sysctl','-n','hw.model'],'cpu':['sysctl','-n','hw.ncpu'],'memoryBytes':['sysctl','-n','hw.memsize'],'architecture':['uname','-m']}; result={key:subprocess.check_output(argv,text=True).strip() for key,argv in commands.items()}; profile=pathlib.Path(os.environ['RUNNER_TEMP'])/'task146-runner-resources.jsonl'; result['resourcePhases']=[json.loads(line)for line in profile.read_text().splitlines()] if profile.exists() else []; print(json.dumps(result,sort_keys=True))"])
          base = ['xcrun', 'xcresulttool', 'get', 'test-results']
          # This aggregate hit its20s limit on697 while the complete tests/DB
          # still contained all8 real results. One bounded export, no retry;
          # byte caps and complete-output qualification remain unchanged.
          summary_ok = export('summary.json', base + ['summary', '--path', str(bundle)], timeout=60)
          tests_ok = export('tests.json', base + ['tests', '--path', str(bundle)])
          provenance['selectionStatus'] = 'NOT_PARSED_INCOMPLETE_SUMMARY_OR_TESTS'
          if summary_ok and tests_ok:
              try:
                  with (output / 'summary.json').open() as source:
                      summary = json.load(source)  # Each complete input is bounded by STDOUT_LIMIT.
                  with (output / 'tests.json').open() as source:
                      tests = json.load(source)
                  provenance['failedLeafCount'] = 0
                  cache_observation = None
                  cache_result = None
                  def walk(value, module=None):
                      if isinstance(value, dict):
                          global cache_observation, cache_result
                          if value.get('nodeType') in {'Unit test bundle', 'UI test bundle'}:
                              module = value.get('name')
                          if value.get('nodeType') == 'Test Case' and value.get('result') in {'Passed','Failed'} and value.get('nodeIdentifier') == 'LocalAvailabilityRootUITests/testIndependentHistoryWorkbookAndCatalogReadWhileAnotherDomainIsHeld()' and module == 'iOSMerchandiseControlUITests':
                              cache_observation = value['nodeIdentifier']
                              cache_result = value['result']
                          if value.get('nodeType') == 'Test Case' and value.get('result') == 'Failed':
                              provenance['failedLeafCount'] += 1
                              if len(provenance['failedTests']) < MAX_FAILED_LEAVES:
                                  if not isinstance(value['nodeIdentifier'], str):
                                      raise TypeError('Non-string test identifier')
                                  provenance['failedTests'].append({'id': value['nodeIdentifier'], 'module': module})
                          for child in value.values():
                              walk(child, module)
                      elif isinstance(value, list):
                          for child in value:
                              walk(child, module)
                  walk(tests)
                  provenance['summaryFailedTests'] = summary['failedTests']
                  provenance['failureCountMatchesSummary'] = provenance['failedLeafCount'] == summary['failedTests']
                  provenance['omittedFailedLeafCount'] = provenance['failedLeafCount'] - len(provenance['failedTests'])
                  provenance['selectionStatus'] = 'PARSED'
                  save()
                  for index, case in enumerate(provenance['failedTests'], 1):
                      for kind in ['test-details', 'activities']:
                          export(f'failure-{index:03d}.{kind}.json',
                                 base + [kind, '--path', str(bundle), '--test-id', case['id']])
                  if cache_observation:
                      provenance['cacheObservationTest'] = {'id': cache_observation, 'result': cache_result, 'purpose': 'Existing physical timing attachment; no acceptance override'}
                      export('cache-observation.activities.json', base + ['activities', '--path', str(bundle), '--test-id', cache_observation])
                      details_ok = export('cache-observation.test-details.json', base + ['test-details', '--path', str(bundle), '--test-id', cache_observation])
                      if details_ok:
                          details = json.loads((output/'cache-observation.test-details.json').read_text())
                          started, duration = details['startTime'], details['durationInSeconds']
                          if not isinstance(started, (int,float)) or not isinstance(duration, (int,float)) or not 0 < duration < 4200:
                              raise ValueError('Invalid closed B2 diagnostic interval')
                          # The75minute store scan timed out on082 after emitting
                          # only early cases. Use this actual test's epoch interval,
                          # preserving the same exporter timeout/byte caps and filter.
                          export('runtime-cost.log', ['xcrun','simctl','spawn',os.environ['DEVICE_ID'],
                              'log','show','--style','compact','--info',
                              '--start','@'+str(int(started)-1),'--end','@'+str(int(started+duration)+2),
                              '--predicate','(subsystem == "com.niwcyber.iOSMerchandiseControl" AND category == "LocalBodyQualification") OR eventMessage BEGINSWITH "TASK146_B2_COST39" OR eventMessage BEGINSWITH "TASK146_R4_INIT"'])
              except (KeyError, ValueError, OSError, TypeError, RecursionError) as error:
                  provenance['selectionErrorType'] = type(error).__name__
                  provenance['selectionStatus'] = 'NOT_PARSED_SELECTION_ERROR'
          save()
          # Diagnostics do not replace the XCTest verdict or the complete bundle.
          sys.exit(0 if all(item.get('complete') is True for item in provenance['exports'])
                   and provenance.get('selectionStatus') == 'PARSED'
                   and not provenance.get('selectionErrorType')
                   and provenance.get('failureCountMatchesSummary') is True
                   and provenance.get('omittedFailedLeafCount') == 0
                   and not provenance.get('metadataTruncated') else 1)
          PY

      - name: Account for every selected test
        if: ${{ always() && matrix.shard != 'campaign-a' }}
        run: python3 .github/ci/ios-xctest-shards.py qualify '${{ matrix.shard }}'

      - name: Stop selected Simulator after native consumers
        if: ${{ always() && env.DEVICE_ID != '' }}
        run: |
          python3 - <<'PY'
          import datetime,json,os,subprocess
          from pathlib import Path
          phase='after-tests'
          device=os.environ['DEVICE_ID']
          def state():
              tree=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json'],text=True,timeout=60))
              found=[row for rows in tree['devices'].values()for row in rows if row['udid']==device]
              assert len(found)==1,'selected Simulator identity changed'
              return found[0]['state'],sum(row['state']=='Booted'for rows in tree['devices'].values()for row in rows)
          # Release the claimed native consumer first; metadata must not block shutdown.
          stopped=subprocess.run(['xcrun','simctl','shutdown',device],capture_output=True,text=True,timeout=60)
          initial='NOT_PROBED_BEFORE_SHUTDOWN'
          current,booted=state()
          assert current=='Shutdown',('selected Simulator shutdown not verified',stopped.returncode,current)
          row={'phase':phase,'atUTC':datetime.datetime.now(datetime.timezone.utc).isoformat(),'device':device,'initialState':initial,'state':current,'bootedCount':booted,
               'swap':subprocess.check_output(['sysctl','vm.swapusage'],text=True,timeout=20).strip()[:8192],
               'vm':subprocess.check_output(['vm_stat'],text=True,timeout=20).strip()[:8192]}
          path=Path(os.environ['RUNNER_TEMP'])/'task146-runner-resources.jsonl'
          if phase=='before-sdk':assert not path.exists(),'refuse mixed resource observations'
          else:pass # An earlier preflight failure does not suppress native cleanup evidence.
          encoded=json.dumps(row,sort_keys=True)+'\n';assert len(encoded.encode())<16384
          with path.open('x'if phase=='before-sdk'else'a')as stream:stream.write(encoded)
          assert path.stat().st_size<=65536,'resource observation bound exceeded'
          print(json.dumps({key:row[key]for key in ['phase','state','bootedCount','swap']}))
          PY

      - name: Preserve exact shard logs, coverage and XCTest diagnostics
        if: ${{ always() && matrix.shard != 'campaign-a' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: task145-ci-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/task146-debug-build-profile.json
            ${{ runner.temp }}/task146-debug-assertion-probe/
            ${{ runner.temp }}/ios-xctest-shard
            ${{ runner.temp }}/ios-xctest-failure-summary
            ${{ runner.temp }}/ios-merchandise-control-tests.xcresult
            ${{ runner.temp }}/task146-runner-resources.jsonl
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false

      - name: Build Release
        if: ${{ matrix.shard == 'unit-target' }}
        timeout-minutes: 20
        run: >-
          xcodebuild -project iOSMerchandiseControl.xcodeproj
          -scheme iOSMerchandiseControl
          -configuration Release
          -destination "generic/platform=iOS Simulator"
          ARCHS=arm64 ONLY_ACTIVE_ARCH=YES
          CODE_SIGNING_ALLOWED=NO build

      - name: Analyze
        if: ${{ matrix.shard == 'unit-target' || matrix.shard == 'campaign-a' }}
        run: >-
          xcodebuild -project iOSMerchandiseControl.xcodeproj
          -scheme iOSMerchandiseControl
          -configuration Debug
          -destination "generic/platform=iOS Simulator"
          CODE_SIGNING_ALLOWED=NO analyze

      - name: Secret scan
        if: ${{ matrix.shard == 'unit-target' || matrix.shard == 'campaign-a' }}
        run: |
          scan_config="$RUNNER_TEMP/task146-sensitive.env"
          scan_evidence="$RUNNER_TEMP/task146-sensitive-evidence"
          cp tools/agent/config.example.env "$scan_config"
          printf '\nMC_IOS_REPO=%q\n' "$GITHUB_WORKSPACE" >> "$scan_config"
          MC_AGENT_CONFIG="$scan_config" MC_TASK_ID=TASK-146 MC_EVIDENCE_DIR="$scan_evidence" \
            ./tools/agent/mc-agent.sh scan sensitive \
            iOSMerchandiseControl iOSMerchandiseControlTests contracts .github/workflows/ios-product-images-ci.yml
          python3 - "$scan_evidence/agent-runs" <<'PY'
          import json
          from pathlib import Path
          import sys

          reports = list(Path(sys.argv[1]).glob("*.json"))
          assert len(reports) == 1, "Expected one persisted sensitive-scan report"
          report = reports[0]
          assert json.loads(report.read_text())["result"] == "PASS"
          for suffix in (".json", ".md", ".log"):
              assert report.with_suffix(suffix).stat().st_size > 0
          print("Sensitive-scan report and log verified")
          PY

  complete-coverage:
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || (inputs.task144_a_campaign != true && inputs.task146_focused_tests == '')) }}
    needs: product-images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Collect every shard result
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: task145-ci-shard-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-all-shards
      - name: Require complete original coverage
        if: ${{ always() }}
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          MATRIX_RESULT: ${{ needs.product-images.result }}
        run: python3 .github/ci/ios-xctest-shards.py aggregate "$RUNNER_TEMP/ios-all-shards"
      - name: Preserve aggregate accounting
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: task145-ci-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-all-shards/aggregate.json
          if-no-files-found: error
          retention-days: 1
