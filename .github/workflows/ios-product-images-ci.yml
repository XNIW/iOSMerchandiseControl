name: iOS Product Images CI

on:
  pull_request:
    paths:
      - ".github/workflows/ios-product-images-ci.yml"
      - "contracts/**"
      - "iOSMerchandiseControl/**"
      - "iOSMerchandiseControlTests/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios-product-images-ci.yml"
      - "contracts/**"
      - "iOSMerchandiseControl/**"
      - "iOSMerchandiseControlTests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-product-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-images:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Verify shared contract hashes
        run: shasum -a 256 -c contracts/product-image-v1.sha256

      - name: Select an available iPhone Simulator
        run: |
          DESTINATIONS="$(xcodebuild \
            -project iOSMerchandiseControl.xcodeproj \
            -scheme iOSMerchandiseControl \
            -showdestinations 2>&1)"
          if ! DEVICE_ID="$(printf '%s\n' "$DESTINATIONS" | ruby -e '
            device_id = nil
            STDIN.each_line do |line|
              match = line.match(/\{ platform:iOS Simulator,.*id:([^,}]+),.*name:iPhone/)
              next unless match

              device_id = match[1].strip
              break
            end
            abort "No scheme-compatible iPhone Simulator" unless device_id
            puts device_id
          ')"; then
            printf '%s\n' "$DESTINATIONS"
            exit 1
          fi
          echo "Selected compatible simulator: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"

      - name: Build Debug
        run: >-
          xcodebuild -project iOSMerchandiseControl.xcodeproj
          -scheme iOSMerchandiseControl
          -configuration Debug
          -destination "platform=iOS Simulator,id=$DEVICE_ID"
          CODE_SIGNING_ALLOWED=NO build

      - name: XCTest full suite
        run: >-
          xcodebuild -project iOSMerchandiseControl.xcodeproj
          -scheme iOSMerchandiseControl
          -configuration Debug
          -destination "platform=iOS Simulator,id=$DEVICE_ID"
          -resultBundlePath "$RUNNER_TEMP/ios-merchandise-control-tests.xcresult"
          CODE_SIGNING_ALLOWED=NO test

      - name: Analyze
        run: >-
          xcodebuild -project iOSMerchandiseControl.xcodeproj
          -scheme iOSMerchandiseControl
          -configuration Debug
          -destination "generic/platform=iOS Simulator"
          CODE_SIGNING_ALLOWED=NO analyze

      - name: Secret scan
        run: >-
          ./tools/agent/mc-agent.sh scan sensitive
          iOSMerchandiseControl
          iOSMerchandiseControlTests
          contracts
          .github/workflows/ios-product-images-ci.yml
